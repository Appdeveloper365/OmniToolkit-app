name: omnitoolkit
description: "OmniToolkit - daily tools for Windows: weather with dual time display, calendar with notes, calculator, internet radio directory, and US ZIP/area code/city lookup."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  http: ^1.2.2

  # Date / time / timezone
  intl: ^0.19.0
  timezone: ^0.9.4

  # Local storage
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Audio streaming
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.15

  # Windows/Linux audio backend for just_audio
  media_kit: ^1.2.6
  just_audio_media_kit: ^2.1.0

  # Calculator expression parsing
  math_expressions: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  msix: ^3.16.8

msix_config:
  display_name: OmniToolkit
  publisher_display_name: BTIM
  identity_name: BTIM.OmniToolkit
  msix_version: 1.0.0.0
  # Partner Center identity: publisher must equal Package/Identity/Publisher exactly.
  publisher: CN=414C09E0-1118-4894-9A2F-45A40232B6A6
  store: true
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
  output_path: build/msix
  output_name: BTIM_OmniToolkit

flutter:
  uses-material-design: true
  assets:
    - assets/data/holidays.json
    - assets/data/lookup_data.json
    - assets/data/curated_us_zips.csv
    - assets/data/radio_streams.json
    - assets/data/area_codes.json
