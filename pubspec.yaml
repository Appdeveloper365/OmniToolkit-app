name: omnitoolkit
description: "OmniToolkit - daily tools for Windows: calendar with notes, calculator, internet radio directory, US ZIP/area code/city lookup, and password generator."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  http: ^1.2.2

  # Date / time / timezone
  intl: ^0.19.0
  timezone: ^0.9.4

  # Local storage
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Audio streaming (Windows/Linux via media_kit)
  just_audio: ^0.9.42

  # Firebase-backed Stripe checkout (no sign-in UI or startup auth gate)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_functions: ^5.1.3
  url_launcher: ^6.3.0

  # Calculator expression parsing
  math_expressions: ^2.6.0
  sqflite_common_ffi_web: ^1.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
flutter:
  uses-material-design: true
  assets:
    - omnitoolkit_logo_master.png
    - assets/data/holidays.json
    - assets/data/lookup_data.json
    - assets/data/curated_us_zips.csv
    - assets/data/radio_streams.json
    - assets/data/area_codes.json

