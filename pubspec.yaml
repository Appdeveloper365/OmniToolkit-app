name: omnitoolkit
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  http: ^1.2.2

  # Date / time / timezone
  intl: ^0.19.0
  timezone: ^0.9.4

  # Local storage
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Audio streaming
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.15

  # Calculator expression parsing
  math_expressions: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/holidays.json
    - assets/data/lookup_data.json
    - assets/data/curated_us_zips.csv
    - assets/data/radio_streams.json
    - assets/data/area_codes.json
