name: Build & Deploy Web PWA

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

concurrency:
  group: web-build-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Flutter Engine
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter-stable"
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_DIR"
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test --concurrency=1

      - name: Materialize Firebase build-time config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tool
          # No Firebase identifier is committed to this repository. Each
          # environment supplies its own values through repository variables
          # (or secrets); they are baked into the bundle at build time.
          API_KEY="${{ vars.FIREBASE_WEB_API_KEY || secrets.FIREBASE_WEB_API_KEY }}"
          AUTH_DOMAIN="${{ vars.FIREBASE_WEB_AUTH_DOMAIN || secrets.FIREBASE_WEB_AUTH_DOMAIN }}"
          PROJECT_ID="${{ vars.FIREBASE_WEB_PROJECT_ID || secrets.FIREBASE_WEB_PROJECT_ID }}"
          STORAGE_BUCKET="${{ vars.FIREBASE_WEB_STORAGE_BUCKET || secrets.FIREBASE_WEB_STORAGE_BUCKET }}"
          SENDER_ID="${{ vars.FIREBASE_WEB_MESSAGING_SENDER_ID || secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}"
          APP_ID="${{ vars.FIREBASE_WEB_APP_ID || secrets.FIREBASE_WEB_APP_ID }}"
          MEASUREMENT_ID="${{ vars.FIREBASE_WEB_MEASUREMENT_ID || secrets.FIREBASE_WEB_MEASUREMENT_ID }}"
          if [ -z "$PROJECT_ID" ] || [ -z "$API_KEY" ] || [ -z "$APP_ID" ]; then
            echo "::warning::No Firebase build-time config supplied. Deploying a build with the local-first modules only (cloud billing/entitlement unavailable)."
            echo '{}' > tool/firebase_defines.json
          else
            cat > tool/firebase_defines.json <<EOF
          {
            "FIREBASE_WEB_API_KEY": "$API_KEY",
            "FIREBASE_WEB_AUTH_DOMAIN": "$AUTH_DOMAIN",
            "FIREBASE_WEB_PROJECT_ID": "$PROJECT_ID",
            "FIREBASE_WEB_STORAGE_BUCKET": "$STORAGE_BUCKET",
            "FIREBASE_WEB_MESSAGING_SENDER_ID": "$SENDER_ID",
            "FIREBASE_WEB_APP_ID": "$APP_ID",
            "FIREBASE_WEB_MEASUREMENT_ID": "$MEASUREMENT_ID"
          }
          EOF
            echo "Firebase build-time config written from repository variables."
          fi

      - name: Build Web PWA
        # --no-web-resources-cdn bundles CanvasKit into build/web/canvaskit
        # instead of loading it from https://www.gstatic.com. That keeps the
        # Content-Security-Policy tight (no third-party script/fetch origin),
        # makes the PWA work offline on a cold start (the service worker only
        # caches same-origin requests), and avoids the GitHub Pages origin
        # never sending the COOP/COEP headers cross-origin isolation needs.
        run: flutter build web --release --no-web-resources-cdn --base-href "/OmniToolkit-app/" --dart-define-from-file=tool/firebase_defines.json

      - name: Preserve Static Legal Docs
        run: |
          # IMPORTANT: Only copy the named legal document files. Never copy
          # docs/index.html (or use a directory-wide "cp -R docs/. build/web/")
          # here -- that previously overwrote the real Flutter-built
          # build/web/index.html with the static legal-docs landing page,
          # causing Microsoft Store to reject the app for missing
          # functionality (10.1.2.10) because reviewers saw a documentation
          # hub instead of the actual OmniToolkit application.
          mkdir -p build/web/docs
          LEGAL_FILES="privacy.html privacy-policy.html terms.html terms-of-service.html"
          for f in $LEGAL_FILES; do
            if [ -f "docs/$f" ]; then
              cp "docs/$f" "build/web/$f"
              cp "docs/$f" "build/web/docs/$f"
            fi
          done
          # docs/index.html is safe to copy ONLY into the nested build/web/docs/
          # path (never build/web/index.html at root, which is the real app entry).
          if [ -f "docs/index.html" ]; then
            cp "docs/index.html" "build/web/docs/index.html"
          fi

      - name: Ensure GitHub Pages Metadata
        run: touch build/web/.nojekyll

      - name: Deploy Web PWA to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach ../gh-pages-deploy origin/gh-pages
          if [ -f ../gh-pages-deploy/CNAME ] && [ ! -f build/web/CNAME ]; then
            cp ../gh-pages-deploy/CNAME build/web/CNAME
          fi
          find ../gh-pages-deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R build/web/. ../gh-pages-deploy/
          cd ../gh-pages-deploy
          git add -A
          if git diff --cached --quiet; then
            echo "No GitHub Pages changes to deploy."
            exit 0
          fi
          git commit -m "deploy: ${GITHUB_SHA}"
          REMOTE_GH_PAGES_SHA=$(git rev-parse refs/remotes/origin/gh-pages)
          git push --force-with-lease=refs/heads/gh-pages:${REMOTE_GH_PAGES_SHA} "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
