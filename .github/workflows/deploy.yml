name: Dual Build & Deployment Pipeline

on:
  push:
    branches:
      - main
      - feature/remove-weather-module
      - omnitoolkit-pwa-publishing-update

permissions:
  contents: write
  pages: write

concurrency:
  group: dual-build-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter-stable"
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_DIR"
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" --version

      - name: Install Android CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'cmake;3.22.1'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test --concurrency=1

      - name: Build Web PWA (IS_STORE_BUILD = false)
        run: flutter build web --release --base-href "/OmniToolkit-app/"

      - name: Build Store-Safe Android APK and AAB (IS_STORE_BUILD = true)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_ANDROID_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_ANDROID_MESSAGING_SENDER_ID }}
          FIREBASE_ANDROID_PROJECT_ID: ${{ secrets.FIREBASE_ANDROID_PROJECT_ID }}
          FIREBASE_ANDROID_STORAGE_BUCKET: ${{ secrets.FIREBASE_ANDROID_STORAGE_BUCKET }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            FIREBASE_ANDROID_API_KEY
            FIREBASE_ANDROID_APP_ID
            FIREBASE_ANDROID_MESSAGING_SENDER_ID
            FIREBASE_ANDROID_PROJECT_ID
            FIREBASE_ANDROID_STORAGE_BUCKET
            GOOGLE_SERVICES_JSON_BASE64
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: ${name}" >&2
              exit 1
            fi
          done
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          flutter build apk --release --dart-define=IS_STORE_BUILD=true \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID" \
            --dart-define=FIREBASE_ANDROID_MESSAGING_SENDER_ID="$FIREBASE_ANDROID_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_ANDROID_PROJECT_ID="$FIREBASE_ANDROID_PROJECT_ID" \
            --dart-define=FIREBASE_ANDROID_STORAGE_BUCKET="$FIREBASE_ANDROID_STORAGE_BUCKET"
          flutter build appbundle --release --dart-define=IS_STORE_BUILD=true \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID" \
            --dart-define=FIREBASE_ANDROID_MESSAGING_SENDER_ID="$FIREBASE_ANDROID_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_ANDROID_PROJECT_ID="$FIREBASE_ANDROID_PROJECT_ID" \
            --dart-define=FIREBASE_ANDROID_STORAGE_BUCKET="$FIREBASE_ANDROID_STORAGE_BUCKET"

      - name: Preserve Static Legal Docs
        run: |
          if [ -d docs ]; then
            mkdir -p build/web/docs
            cp -R docs/. build/web/docs/
          fi

      - name: Package Android Store Artifacts into Web Release Directory
        run: |
          mkdir -p build/web/downloads
          cp build/app/outputs/flutter-apk/app-release.apk build/web/downloads/productivity-radio.apk
          cp build/app/outputs/bundle/release/app-release.aab build/web/downloads/productivity-radio.aab

      - name: Ensure GitHub Pages Metadata
        run: touch build/web/.nojekyll

      - name: Deploy Web PWA & Android Store Artifacts to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach ../gh-pages-deploy origin/gh-pages
          if [ -f ../gh-pages-deploy/CNAME ] && [ ! -f build/web/CNAME ]; then
            cp ../gh-pages-deploy/CNAME build/web/CNAME
          fi
          find ../gh-pages-deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R build/web/. ../gh-pages-deploy/
          cd ../gh-pages-deploy
          git add -A
          if git diff --cached --quiet; then
            echo "No GitHub Pages changes to deploy."
            exit 0
          fi
          git commit -m "deploy: ${GITHUB_SHA}"
          REMOTE_GH_PAGES_SHA=$(git rev-parse refs/remotes/origin/gh-pages)
          git push --force-with-lease=refs/heads/gh-pages:${REMOTE_GH_PAGES_SHA} "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

