<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OmniToolkit - Offline utilities: Weather, Calendar, Calculator, Radio, Lookup, Clipper">

  <!-- Security: Content Security Policy - allows Flutter runtime (eval for dart2js, wasm, inline styles/scripts)
       NOTE: 'frame-ancestors' and X-Frame-Options are ignored by browsers when delivered via
       <meta>; they can only be sent as real HTTP response headers. GitHub Pages cannot send
       custom headers, so clickjacking protection is applied by service-worker.js instead
       (for the same-origin responses it serves). -->
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://www.gstatic.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https: blob:;
      connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com https://api.met.no https://*.radio-browser.info wss:;
      media-src 'self' https: blob:;
      frame-src 'self';
      base-uri 'self';
      form-action 'self';
      object-src 'none';
      manifest-src 'self';
      worker-src 'self' blob:;
    ">

  <!-- Security: Permissions Policy (Feature Policy) -->
  <meta http-equiv="Permissions-Policy"
    content="
      accelerometer=(),
      camera=(),
      geolocation=(self),
      gyroscope=(),
      magnetometer=(),
      microphone=(),
      payment=(),
      usb=(),
      interest-cohort=()
    ">

  <!-- Security: Additional headers (Referrer-Policy is valid in <meta>; the
       other header-only protections are set by service-worker.js) -->
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="omnitoolkit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OmniToolkit</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Register the PWA worker once. Flutter's generated worker is not used
       because this project owns update and offline behavior explicitly. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js', {
        scope: './',
        updateViaCache: 'none',
      }).then((reg) => {
        console.log('[Service Worker] Registered successfully:', reg);
      }).catch((err) => {
        console.log('[Service Worker] Registration failed:', err);
      });
    }
  </script>

  <!-- Flutter loader configuration now lives in flutter_bootstrap.js, where
       _flutter.loader.load({ config: {...} }) is called. Do not re-add an
       inline `window._flutter.loaderConfig` block here: flutter.js does not
       read that key. -->
</body>
</html>
